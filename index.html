    // =====================================================
    // 3. SYNTHESIZED SOUND & VOICE ENGINE
    // =====================================================
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function speakText(text) {
      const speechEl = document.getElementById('speechText');
      if (speechEl) speechEl.textContent = text;

      if (state.muted) return;
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'zh-CN';
          utter.rate = 1.06;
          utter.pitch = 1.15;
          window.speechSynthesis.speak(utter);
        }
      } catch (e) {}
    }

    function playSound(type) {
      if (state.muted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;

      if (type === 'pop') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.11);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      } else if (type === 'drill') {
        // Pneumatic impact wrench sound + chime!
        for (let i = 0; i < 3; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180 + i * 90, now + i * 0.055);
          osc.frequency.exponentialRampToValueAtTime(520 + i * 120, now + i * 0.055 + 0.05);
          gain.gain.setValueAtTime(0.16, now + i * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.055 + 0.055);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.055);
          osc.stop(now + i * 0.055 + 0.055);
        }
      } else if (type === 'star') {
        const notes = [587.33, 880, 1174.66];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);
          gain.gain.setValueAtTime(0.2, now + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.05 + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.05);
          osc.stop(now + idx * 0.05 + 0.18);
        });
      } else if (type === 'jump') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(620, now + 0.24);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'boost') {
        // Deep turbo roar
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.38);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'horn') {
        const stickerObj = CAR_STICKERS.find(s => s.id === state.car.sticker) || CAR_STICKERS[0];
        const hType = stickerObj.hornType;
        if (hType === 'duck') {
          [0, 0.15].forEach(offset => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(440, now + offset);
            osc.frequency.linearRampToValueAtTime(310, now + offset + 0.1);
            gain.gain.setValueAtTime(0.2, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.11);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.11);
          });
        } else if (hType === 'siren') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.linearRampToValueAtTime(920, now + 0.2);
          osc.frequency.linearRampToValueAtTime(580, now + 0.4);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.42);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.42);
        } else if (hType === 'roar') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.exponentialRampToValueAtTime(85, now + 0.36);
          gain.gain.setValueAtTime(0.26, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        } else if (hType === 'laser') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1020, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.22);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        } else {
          // Dual-tone sports car horn / melody
          const melody = [523.25, 659.25, 783.99, 1046.5];
          melody.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + i * 0.075);
            gain.gain.setValueAtTime(0.2, now + i * 0.075);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.075 + 0.12);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.075);
            osc.stop(now + i * 0.075 + 0.12);
          });
        }
      }
    }

    // =====================================================

    function triggerSuspensionBounce(impulse = -7.5) {

    function triggerRobotArmInstall() {
      state.robotArmProgress = 1.0;

      const cx = canvas.width * 0.5;
      const cy = canvas.height * 0.52;
      const sparkColors = ['#FEF08A', '#38BDF8', '#F97316', '#4ADE80'];
      for (let i = 0; i < 20; i++) {
        const angle = (Math.PI * 2 * i) / 20 + (Math.random() - 0.5) * 0.4;
        const speed = 3 + Math.random() * 6;
        state.particles.push({
          x: cx + (Math.random() - 0.5) * 80,
          y: cy + (Math.random() - 0.5) * 30,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          size: 4 + Math.random() * 5,
          color: sparkColors[i % sparkColors.length],
          life: 32 + Math.random() * 18
        });
      }
    }

    function renderCategoryOptions() {
      optionsContainer.innerHTML = '';
      let list = [];
      let currentVal = '';

      if (state.activeTab === 'body') {
        list = CAR_BODIES;
        currentVal = state.car.body;
      } else if (state.activeTab === 'color') {
        list = CAR_COLORS;
        currentVal = state.car.color;
      } else if (state.activeTab === 'wheel') {
        list = CAR_WHEELS;
        currentVal = state.car.wheel;
      } else if (state.activeTab === 'topper') {
        list = CAR_TOPPERS;
        currentVal = state.car.topper;
      } else if (state.activeTab === 'sticker') {
        list = CAR_STICKERS;
        currentVal = state.car.sticker;
      }

      list.forEach(item => {
        const btn = document.createElement('button');
        const isSelected = item.id === currentVal;
        btn.className = `toy-card rounded-2xl p-2 sm:p-2.5 flex flex-col items-center justify-center gap-1.5 ${isSelected ? 'toy-card-active' : ''}`;

        if (state.activeTab === 'color') {
          btn.innerHTML = `
            <div class="w-11 h-11 rounded-full border-2 border-white shadow-md flex items-center justify-center" style="background: linear-gradient(135deg, ${item.top} 0%, ${item.bottom} 100%);">
              <div class="w-4 h-2 rounded-full bg-white/60 -mt-4"></div>
            </div>
            <span class="card-label text-xs sm:text-sm font-black text-slate-100">${item.name}</span>
          `;
        } else if (state.activeTab === 'sticker') {
          btn.innerHTML = `
            <div class="w-12 h-9 rounded-xl bg-slate-900/80 border border-slate-500 flex items-center justify-center text-lg font-black text-amber-300 shadow-inner">
              ${item.badge}
            </div>
            <span class="card-label text-xs sm:text-sm font-black text-slate-100">${item.name}</span>
          `;
        } else {
          btn.innerHTML = `
            <div class="flex items-center justify-center h-10">${item.svg}</div>
            <span class="card-label text-xs sm:text-sm font-black text-slate-100">${item.name}</span>
          `;

        btn.addEventListener('click', () => {
          state.car[state.activeTab] = item.id;
          saveState();
          triggerSuspensionBounce(-8);
          triggerRobotArmInstall();
          playSound('drill');
          if (state.activeTab === 'sticker' && item.hornLabel) {
            speakText(`已装配${item.name}，激活${item.hornLabel}！`);

          } else {
            speakText(`改装完成！已装配${item.name}！`);

          renderCategoryOptions();
        });

        optionsContainer.appendChild(btn);

        e.preventDefault();
        if (state.mode === 'drive') triggerJump();

    function resizeCanvas() {

    function spawnInitialCollectibles() {
      state.collectibles = [];
      for (let i = 0; i < 5; i++) {
        state.collectibles.push({
          x: canvas.width * 0.6 + i * 210,
          y: i % 2 === 0 ? canvas.height - 140 : canvas.height - 215,
          type: i % 3 === 0 ? 'nitro' : 'star',
          bobPhase: i * 1.1
        });
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let i = state.bubbles.length - 1; i >= 0; i--) {
        const b = state.bubbles[i];
        if (Math.hypot(clickX - b.x, clickY - b.y) <= b.r + 14) {
          state.bubbles.splice(i, 1);
          playSound('pop');
          return;
        }
      }

      if (state.mode === 'drive') {
        triggerJump();
      } else {
        triggerHorn();
      }
    });

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // Draw High-Tech Workshop or Outdoor Track
    function drawEnvironment(w, h) {
      const scene = SCENES[state.sceneIndex];

      // Sky Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h - 70);
      skyGrad.addColorStop(0, scene.skyTop);
      skyGrad.addColorStop(1, scene.skyBottom);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      // Sun / Moon & Stars
      ctx.save();
      if (scene.id === 'night') {
        ctx.fillStyle = '#FEF08A';
        ctx.shadowColor = '#FEF08A';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(w - 90, 58, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#E2E8F0';
        for (let i = 0; i < 18; i++) {
          const sx = (i * 73 + 30) % w;
          const sy = (i * 31 + 18) % 135;
          ctx.beginPath();
          ctx.arc(sx, sy, (i % 2) + 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = '#FDE047';
        ctx.shadowColor = '#F59E0B';
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(w - 90, 58, 28, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Parallax Clouds
      ctx.fillStyle = scene.id === 'night' ? 'rgba(148,163,184,0.18)' : 'rgba(255,255,255,0.82)';
      state.clouds.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.scale, c.scale);
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, Math.PI * 2);
        ctx.arc(22, -6, 25, 0, Math.PI * 2);
        ctx.arc(46, 0, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Far Mountains / Hills
      ctx.fillStyle = scene.hillFar;
      ctx.beginPath();
      ctx.moveTo(0, h - 72);
      for (let x = 0; x <= w + 40; x += 40) {
        const y = h - 98 + Math.sin((x + state.roadOffset * 0.18) * 0.009) * 24;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();

      // Near Hills
      ctx.fillStyle = scene.hillNear;
      ctx.beginPath();
      ctx.moveTo(0, h - 72);
      for (let x = 0; x <= w + 30; x += 30) {
        const y = h - 80 + Math.cos((x + state.roadOffset * 0.35) * 0.015) * 12;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();

      // Asphalt Track / Workshop Floor
      const roadGrad = ctx.createLinearGradient(0, h - 74, 0, h);
      roadGrad.addColorStop(0, scene.roadTop);
      roadGrad.addColorStop(1, scene.roadBottom);
      ctx.fillStyle = roadGrad;
      ctx.fillRect(0, h - 74, w, 74);

      // Red & White Racing Curb
      const curbW = 36;
      const curbOffset = Math.floor(state.roadOffset * 0.8) % (curbW * 2);
      for (let x = -curbW * 2; x < w + curbW * 2; x += curbW) {
        const isRed = Math.floor((x + curbOffset) / curbW) % 2 === 0;
        ctx.fillStyle = isRed ? '#EF4444' : '#F8FAFC';
        ctx.fillRect(x - (state.roadOffset * 0.8 % curbW), h - 74, curbW, 7);
      }

      // Dashed Center Track Line
      ctx.fillStyle = '#FACC15';
      const dashStep = 95;
      const dashOff = state.roadOffset % dashStep;
      for (let x = -dashStep; x < w + dashStep; x += dashStep) {
        ctx.fillRect(x - dashOff, h - 38, 48, 6);
      }

      // GARAGE MODE: Draw Workshop Bay, Tool Cabinets & Hydraulic Scissor Lift
      if (state.mode === 'garage') {
        const cx = w * 0.5;
        const floorY = h - 28;

        // Back Workshop Frame & Tool Wall
        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
        drawRoundedRect(cx - 230, 56, 460, floorY - 82, 18);
        ctx.fill();
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Red Tool Chest on Left
        ctx.fillStyle = '#DC2626';
        drawRoundedRect(cx - 210, floorY - 125, 68, 95, 6);
        ctx.fill();
        ctx.fillStyle = '#991B1B';
        for (let d = 0; d < 4; d++) {
          ctx.fillRect(cx - 204, floorY - 116 + d * 21, 56, 15);
          ctx.fillStyle = '#CBD5E1';
          ctx.fillRect(cx - 190, floorY - 111 + d * 21, 28, 3);
          ctx.fillStyle = '#991B1B';
        }

        // Tire Rack on Right
        ctx.strokeStyle = '#64748B';
        ctx.lineWidth = 4;
        ctx.strokeRect(cx + 145, floorY - 130, 64, 98);
        ctx.fillStyle = '#1E293B';
        for (let t = 0; t < 3; t++) {
          ctx.fillRect(cx + 152 + t * 18, floorY - 122, 12, 38);
          ctx.fillRect(cx + 152 + t * 18, floorY - 72, 12, 36);
        }

        // Hydraulic Scissor Lift under the Car
        const liftH = state.liftHeight;
        // Base plate
        ctx.fillStyle = '#334155';
        ctx.fillRect(cx - 135, floorY - 8, 270, 8);
        // Scissor X struts
        ctx.strokeStyle = '#F59E0B';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx - 85, floorY - 6);
        ctx.lineTo(cx + 85, floorY - 8 - liftH);
        ctx.moveTo(cx + 85, floorY - 6);
        ctx.lineTo(cx - 85, floorY - 8 - liftH);
        ctx.stroke();

        // Top Platform of Lift
        ctx.fillStyle = '#EAB308';
        drawRoundedRect(cx - 145, floorY - 18 - liftH, 290, 12, 4);
        ctx.fill();
        ctx.fillStyle = '#EF4444';
        ctx.fillRect(cx - 145, floorY - 18 - liftH, 22, 12);
        ctx.fillRect(cx + 123, floorY - 18 - liftH, 22, 12);

        // Overhead Robotic Arm when installing parts
        if (state.robotArmProgress > 0) {
          const armDrop = Math.sin(state.robotArmProgress * Math.PI) * 95;
          ctx.strokeStyle = '#FACC15';
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.moveTo(cx, 0);
          ctx.lineTo(cx - 18, 35 + armDrop * 0.5);
          ctx.lineTo(cx, 65 + armDrop);
          ctx.stroke();

          // Claw
          ctx.strokeStyle = '#38BDF8';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(cx, 74 + armDrop, 16, Math.PI * 0.15, Math.PI * 0.85, true);
          ctx.stroke();
        }
        ctx.restore();
      }

      // DRIVE MODE: Draw Stunt Ramps & Collectibles
      if (state.mode === 'drive') {
        const floorY = h - 32;
        state.ramps.forEach(ramp => {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(ramp.x, floorY);
          ctx.lineTo(ramp.x + ramp.width, floorY - ramp.height);
          ctx.lineTo(ramp.x + ramp.width, floorY);
          ctx.closePath();
          const rGrad = ctx.createLinearGradient(ramp.x, floorY, ramp.x + ramp.width, floorY - ramp.height);
          rGrad.addColorStop(0, '#F59E0B');
          rGrad.addColorStop(1, '#EF4444');
          ctx.fillStyle = rGrad;
          ctx.fill();
          ctx.strokeStyle = '#FEF08A';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Chevron boost arrows on ramp
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 16px sans-serif';
          ctx.fillText('>>>', ramp.x + ramp.width * 0.45, floorY - ramp.height * 0.35);
          ctx.restore();
        });

        // Draw Collectibles (Golden 3D Stars & Nitro Bottles)
        state.collectibles.forEach(item => {
          const bob = Math.sin(item.bobPhase) * 7;
          const ix = item.x;
          const iy = item.y + bob;
          ctx.save();
          ctx.translate(ix, iy);
          if (item.type === 'nitro') {
            // Nitro Energy Cell
            ctx.fillStyle = '#38BDF8';
            ctx.shadowColor = '#38BDF8';
            ctx.shadowBlur = 12;
            drawRoundedRect(-11, -16, 22, 32, 6);
            ctx.fill();
            ctx.fillStyle = '#FEF08A';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⚡', 0, 1);
          } else {
            // Glowing 5-point Star
            ctx.fillStyle = '#FACC15';
            ctx.strokeStyle = '#FEF08A';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#F59E0B';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
              const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
              const a2 = a1 + Math.PI / 5;
              ctx.lineTo(Math.cos(a1) * 18, Math.sin(a1) * 18);
              ctx.lineTo(Math.cos(a2) * 8, Math.sin(a2) * 8);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
          ctx.restore();
        });
      }
    }

    // Draw Detailed Vector Wheel + Brake Disc + Caliper
    function drawDetailedWheel(cx, cy, baseRadius, wheelType, angle) {
      const wheelObj = CAR_WHEELS.find(w => w.id === wheelType) || CAR_WHEELS[0];
      const r = baseRadius * wheelObj.scale;

      ctx.save();
      ctx.translate(cx, cy);

      // Brake Caliper (stationary behind spokes)
      ctx.fillStyle = '#EF4444';
      drawRoundedRect(-r * 0.55, -r * 0.35, r * 0.35, r * 0.45, 3);
      ctx.fill();

      ctx.rotate(angle);

      if (wheelType === 'donut') {
        // Tire base: Golden Dough
        ctx.fillStyle = '#D97706';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#92400E';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Strawberry Frosting
        ctx.fillStyle = '#EC4899';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.76, 0, Math.PI * 2);
        ctx.fill();

        // Sprinkles
        const spCols = ['#FEF08A', '#38BDF8', '#4ADE80', '#FFFFFF'];
        for (let i = 0; i < 8; i++) {
          const a = (i * Math.PI) / 4;
          ctx.fillStyle = spCols[i % spCols.length];
          ctx.save();
          ctx.rotate(a);
          drawRoundedRect(r * 0.42, -2, 6, 3.5, 1.5);
          ctx.fill();
          ctx.restore();
        }
      } else if (wheelType === 'rainbow') {
        // Cyber Neon Tire
        ctx.fillStyle = '#0F172A';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        const neonRings = ['#38BDF8', '#EC4899', '#FACC15', '#4ADE80'];
        neonRings.forEach((col, idx) => {
          ctx.strokeStyle = col;
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          ctx.arc(0, 0, r * (0.86 - idx * 0.16), 0, Math.PI * 2);
          ctx.stroke();
        });
      } else {
        // Rubber Tire with tread
        ctx.fillStyle = '#0F172A';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        // Deep Offroad Lugs for Monster or Flower (Mecha Gear)
        if (wheelType === 'monster' || wheelType === 'flower') {
          const lugCount = wheelType === 'monster' ? 12 : 10;
          ctx.fillStyle = wheelType === 'flower' ? '#F59E0B' : '#1E293B';
          for (let i = 0; i < lugCount; i++) {
            const a = (i * Math.PI * 2) / lugCount;
            ctx.save();
            ctx.rotate(a);
            ctx.fillRect(r - 4, -4, 7, 8);
            ctx.restore();
          }
        }

        // Tire Sidewall Ring
        ctx.strokeStyle = wheelType === 'star' ? '#F8FAFC' : '#334155';
        ctx.lineWidth = wheelType === 'star' ? 3.5 : 2;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2);
        ctx.stroke();

        // Metallic Rim Cavity
        ctx.fillStyle = '#1E293B';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.66, 0, Math.PI * 2);
        ctx.fill();

        // Steel Brake Rotor
        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.42, 0, Math.PI * 2);
        ctx.stroke();

        // Spokes by type
        if (wheelType === 'star') {
          ctx.fillStyle = '#FACC15';
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
            const a2 = a1 + Math.PI / 5;
            ctx.lineTo(Math.cos(a1) * (r * 0.64), Math.sin(a1) * (r * 0.64));
            ctx.lineTo(Math.cos(a2) * (r * 0.26), Math.sin(a2) * (r * 0.26));
          }
          ctx.closePath();
          ctx.fill();
        } else if (wheelType === 'monster') {
          // Beadlock Gold Offroad Rim
          ctx.strokeStyle = '#F59E0B';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.58, 0, Math.PI * 2);
          ctx.stroke();
          for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI) / 3;
            ctx.strokeStyle = '#CBD5E1';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55);
            ctx.stroke();
          }
        } else {
          // 5 Twin-Spoke GT Alloy Rim
          ctx.strokeStyle = '#E2E8F0';
          ctx.lineWidth = 2.8;
          for (let i = 0; i < 5; i++) {
            const a = (i * Math.PI * 2) / 5;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a - 0.12) * r * 0.64, Math.sin(a - 0.12) * r * 0.64);
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a + 0.12) * r * 0.64, Math.sin(a + 0.12) * r * 0.64);
            ctx.stroke();
          }
        }
      }

      // Center Hub Nut
      ctx.fillStyle = '#EF4444';
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.17, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    // Draw Coiled Suspension Strut connecting Chassis to Wheel Hub
    function drawSuspensionStrut(x, topY, bottomY) {
      ctx.save();
      // Hydraulic piston rod
      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(x, topY);
      ctx.lineTo(x, bottomY);
      ctx.stroke();

      // Red Coilover Spring
      ctx.strokeStyle = '#EF4444';
      ctx.lineWidth = 3.5;
      const coils = 4;
      const step = (bottomY - topY) / coils;
      ctx.beginPath();
      for (let i = 0; i < coils; i++) {
        const y1 = topY + i * step;
        const y2 = y1 + step * 0.5;
        ctx.moveTo(x - 7, y1);
        ctx.lineTo(x + 7, y2);
        ctx.lineTo(x - 7, y1 + step);
      }
      ctx.stroke();
      ctx.restore();
    }

    // Draw Vector Car Body, Livery Decals, Driver & Topper
    function drawCompleteCar(centerX, baseGroundY) {
      const colorObj = CAR_COLORS.find(c => c.id === state.car.color) || CAR_COLORS[0];
      const stickerObj = CAR_STICKERS.find(s => s.id === state.car.sticker) || CAR_STICKERS[0];
      const bodyType = state.car.body;
      const liftOffset = state.mode === 'garage' ? -state.liftHeight - 14 : 0;

      const carY = baseGroundY - 58 + liftOffset + state.chassisY;

      ctx.save();
      ctx.translate(centerX, carY);
      ctx.rotate(state.chassisPitch);

      // Ground Shadow
      ctx.save();
      ctx.rotate(-state.chassisPitch);
      const shadowDist = -state.chassisY;
      ctx.fillStyle = 'rgba(2, 6, 23, 0.42)';
      ctx.beginPath();
      ctx.ellipse(0, 32 - state.chassisY, Math.max(55, 118 - shadowDist * 0.35), 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Night Mode Headlight Cone
      if (SCENES[state.sceneIndex].id === 'night' || state.boostTimer > 0) {
        ctx.save();
        const beamGrad = ctx.createLinearGradient(110, -28, 310, 10);
        beamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.55)');
        beamGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
        ctx.fillStyle = beamGrad;
        ctx.beginPath();
        ctx.moveTo(108, -34);
        ctx.lineTo(320, -68);
        ctx.lineTo(320, 22);
        ctx.lineTo(108, -18);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Rear Exhaust Afterburner when Boosting
      if (state.boostTimer > 0) {
        const fLen = 65 + Math.random() * 35;
        ctx.save();
        const fGrad = ctx.createLinearGradient(-115, -18, -115 - fLen, -18);
        fGrad.addColorStop(0, '#38BDF8');
        fGrad.addColorStop(0.4, '#FACC15');
        fGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
        ctx.fillStyle = fGrad;
        ctx.beginPath();
        ctx.moveTo(-112, -26);
        ctx.lineTo(-115 - fLen, -16);
        ctx.lineTo(-112, -6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Draw Suspension Struts behind body
      const rearWheelX = -72;
      const frontWheelX = 72;
      const wheelBaseY = 10 - state.frontWheelCompression * 0.4;
      drawSuspensionStrut(rearWheelX, -24, wheelBaseY);
      drawSuspensionStrut(frontWheelX, -24, wheelBaseY);

      // Metallic Body Gradient
      const bodyGrad = ctx.createLinearGradient(0, -115, 0, 5);
      bodyGrad.addColorStop(0, colorObj.top);
      bodyGrad.addColorStop(0.65, colorObj.bottom);
      bodyGrad.addColorStop(1, '#0F172A');

      // Define Chassis Silhouette Path per Body Type
      ctx.save();
      ctx.beginPath();
      if (bodyType === 'sport') {
        // Sleek GT Supercar Silhouette
        ctx.moveTo(-118, -8);
        ctx.lineTo(-122, -34);
        ctx.quadraticCurveTo(-105, -48, -76, -52);
        ctx.lineTo(-42, -92);
        ctx.quadraticCurveTo(-28, -100, 16, -98);
        ctx.lineTo(64, -54);
        ctx.quadraticCurveTo(108, -48, 124, -22);
        ctx.lineTo(120, -8);
        ctx.closePath();
      } else if (bodyType === 'monster') {
        // Lifted 4x4 Pickup Silhouette
        ctx.moveTo(-116, -16);
        ctx.lineTo(-116, -68);
        ctx.lineTo(-56, -68);
        ctx.lineTo(-44, -114);
        ctx.lineTo(36, -114);
        ctx.lineTo(54, -68);
        ctx.lineTo(116, -62);
        ctx.lineTo(116, -16);
        ctx.closePath();
      } else if (bodyType === 'firetruck') {
        // Heavy Rescue Fire Engine
        ctx.moveTo(-122, -8);
        ctx.lineTo(-122, -96);
        ctx.lineTo(28, -96);
        ctx.lineTo(28, -108);
        ctx.lineTo(108, -108);
        ctx.lineTo(118, -56);
        ctx.lineTo(118, -8);
        ctx.closePath();
      } else if (bodyType === 'icecream') {
        // Rounded Retro Camper Bus
        drawRoundedRect(-114, -106, 228, 98, 28);
      } else if (bodyType === 'dino') {
        // Armored Jurassic Mecha Buggy
        ctx.moveTo(-118, -12);
        ctx.lineTo(-104, -64);
        ctx.lineTo(-46, -102);
        ctx.lineTo(38, -102);
        ctx.lineTo(96, -62);
        ctx.lineTo(124, -36);
        ctx.lineTo(112, -12);
        ctx.closePath();
      } else {
        // Cyber Space Rover
        ctx.moveTo(-120, -18);
        ctx.quadraticCurveTo(-125, -58, -65, -66);
        ctx.arc(0, -64, 58, Math.PI, 0, false);
        ctx.quadraticCurveTo(125, -58, 120, -18);
        ctx.closePath();
      }

      ctx.fillStyle = bodyGrad;
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#F8FAFC';
      ctx.stroke();

      // Clip inside Car Body for Custom Livery Decals & Gloss Reflections!
      ctx.clip();

      // Top Specular Gloss Highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.fillRect(-130, -115, 260, 26);

      // Livery Pattern based on selected Sticker
      if (stickerObj.pattern === 'stripe') {
        // Racing Twin Stripes + Number Circle
        ctx.fillStyle = colorObj.accent;
        ctx.fillRect(-130, -40, 260, 12);
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(0, -34, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0F172A';
        ctx.font = '900 18px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('77', 0, -33);
      } else if (stickerObj.pattern === 'flame') {
        // Hot Rod Flames from front fender
        ctx.fillStyle = '#FACC15';
        ctx.beginPath();
        ctx.moveTo(125, -15);
        ctx.lineTo(25, -48);
        ctx.lineTo(48, -28);
        ctx.lineTo(-35, -42);
        ctx.lineTo(10, -18);
        ctx.lineTo(-55, -14);
        ctx.closePath();
        ctx.fill();
      } else if (stickerObj.pattern === 'bolt') {
        // Lightning Bolt Livery
        ctx.fillStyle = '#FEF08A';
        ctx.beginPath();
        ctx.moveTo(-65, -22);
        ctx.lineTo(5, -52);
        ctx.lineTo(-8, -32);
        ctx.lineTo(68, -56);
        ctx.lineTo(8, -18);
        ctx.lineTo(20, -34);
        ctx.closePath();
        ctx.fill();
      } else if (stickerObj.pattern === 'rescue') {
        // Rescue High-Vis Stripe
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(-130, -38, 260, 14);
        ctx.fillStyle = '#FACC15';
        ctx.fillRect(-130, -24, 260, 6);
      } else if (stickerObj.pattern === 'cyber') {
        // Neon Cyber Grid Stripe
        ctx.strokeStyle = '#38BDF8';
        ctx.lineWidth = 3;
        for (let i = -3; i <= 3; i++) {
          ctx.strokeRect(i * 34 - 12, -46, 24, 20);
        }
      } else {
        // Cute Paw / Polka Dots
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        [-65, -20, 25, 70].forEach((dx, idx) => {
          ctx.beginPath();
          ctx.arc(dx, idx % 2 === 0 ? -42 : -26, 9, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // Dark Wheel Arch Cutouts
      const archY = bodyType === 'monster' ? -14 : -6;
      ctx.fillStyle = '#090D16';
      ctx.beginPath();
      ctx.arc(rearWheelX, archY, 35, Math.PI, 0, false);
      ctx.arc(frontWheelX, archY, 35, Math.PI, 0, false);
      ctx.fill();

      ctx.restore(); // End Body Clip

      // Body-Specific Mechanical Details (Rollbars, Ladders, Dino Spikes, Cockpit Window, Driver)
      const cockpitGrad = ctx.createLinearGradient(0, -102, 0, -54);
      cockpitGrad.addColorStop(0, '#E0F2FE');
      cockpitGrad.addColorStop(1, '#38BDF8');
      ctx.fillStyle = cockpitGrad;
      ctx.strokeStyle = '#0F172A';
      ctx.lineWidth = 3;

      if (bodyType === 'sport') {
        ctx.beginPath();
        ctx.moveTo(-36, -54);
        ctx.lineTo(-22, -90);
        ctx.lineTo(14, -90);
        ctx.lineTo(54, -54);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (bodyType === 'monster') {
        drawRoundedRect(-36, -106, 66, 38, 8);
        ctx.fill();
        ctx.stroke();
        // Heavy Steel Bullbar on front
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(106, -18);
        ctx.lineTo(124, -56);
        ctx.lineTo(108, -56);
        ctx.stroke();
      } else if (bodyType === 'firetruck') {
        drawRoundedRect(42, -100, 66, 40, 6);
        ctx.fill();
        ctx.stroke();
        // Chrome Equipment Rollup Shutters
        ctx.fillStyle = '#CBD5E1';
        drawRoundedRect(-106, -84, 62, 42, 4);
        ctx.fill();
        ctx.fillStyle = '#94A3B8';
        drawRoundedRect(-34, -84, 58, 42, 4);
        ctx.fill();
        // Fire Ladder on Roof
        ctx.strokeStyle = '#FDE047';
        ctx.lineWidth = 3.5;
        ctx.strokeRect(-114, -112, 128, 12);
        for (let lx = -104; lx < 10; lx += 16) {
          ctx.beginPath();
          ctx.moveTo(lx, -112);
          ctx.lineTo(lx, -100);
          ctx.stroke();
        }
      } else if (bodyType === 'icecream') {
        drawRoundedRect(-24, -94, 118, 38, 10);
        ctx.fill();
        ctx.stroke();
        // Striped Awning over serving window
        const awCols = ['#EF4444', '#FFFFFF', '#EF4444', '#FFFFFF', '#EF4444', '#FFFFFF'];
        awCols.forEach((ac, i) => {
          ctx.fillStyle = ac;
          ctx.fillRect(-24 + i * 19.5, -96, 19.5, 9);
        });
      } else if (bodyType === 'dino') {
        drawRoundedRect(-36, -94, 72, 36, 10);
        ctx.fill();
        ctx.stroke();
        // Mechanical Dorsal Plates on Roof/Back
        ctx.fillStyle = '#FACC15';
        ctx.strokeStyle = '#CA8A04';
        ctx.lineWidth = 2;
        for (let s = 0; s < 5; s++) {
          const sx = -96 + s * 28;
          const sy = s === 0 ? -68 : -102;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx + 12, sy - 18);
          ctx.lineTo(sx + 24, sy);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      } else {
        // UFO Glass Dome
        ctx.beginPath();
        ctx.arc(0, -62, 52, Math.PI, 0, false);
        ctx.fill();
        ctx.stroke();
      }

      // Cute Vector Racer Helmet Driver inside Cockpit
      const driverX = bodyType === 'firetruck' ? 68 : 4;
      const driverY = bodyType === 'monster' ? -82 : -70;
      ctx.save();
      ctx.translate(driverX, driverY);
      // Helmet
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#EF4444';
      ctx.lineWidth = 3;
      ctx.stroke();
      // Visor
      ctx.fillStyle = '#0F172A';
      drawRoundedRect(0, -6, 13, 9, 4);
      ctx.fill();
      ctx.restore();

      // Glowing LED Headlights & Grille on Front
      ctx.fillStyle = '#FEF08A';
      ctx.shadowColor = '#FACC15';
      ctx.shadowBlur = 10;
      drawRoundedRect(106, -40, 14, 12, 4);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Rear Taillight
      ctx.fillStyle = '#EF4444';
      drawRoundedRect(-120, -42, 10, 14, 3);
      ctx.fill();

      // Draw Topper / Performance Kit on Roof or Rear
      const roofY = bodyType === 'monster' ? -116 : bodyType === 'firetruck' ? -112 : bodyType === 'icecream' ? -108 : -102;
      ctx.save();
      if (state.car.topper === 'rocket') {
        // Twin Chrome Nitro Rocket Thrusters
        ctx.translate(-12, roofY - 14);
        ctx.fillStyle = '#E2E8F0';
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2.5;
        drawRoundedRect(-28, -10, 52, 20, 8);
        ctx.fill();
        ctx.stroke();
        // Red Nose Cone & Rear Nozzle
        ctx.fillStyle = '#EF4444';
        ctx.beginPath();
        ctx.moveTo(24, -10);
        ctx.lineTo(38, 0);
        ctx.lineTo(24, 10);
        ctx.closePath();
        ctx.fill();
        // Thruster Flame
        const jetLen = state.boostTimer > 0 ? 48 + Math.random() * 20 : 18 + Math.random() * 8;
        ctx.fillStyle = '#38BDF8';
        ctx.beginPath();
        ctx.moveTo(-28, -7);
        ctx.lineTo(-28 - jetLen, 0);
        ctx.lineTo(-28, 7);
        ctx.closePath();
        ctx.fill();
      } else if (state.car.topper === 'siren') {
        // Flashing Police/Rescue LED Lightbar
        ctx.translate(0, roofY - 8);
        ctx.fillStyle = '#94A3B8';
        ctx.fillRect(-24, 0, 48, 6);
        const flash = Math.floor(Date.now() / 150) % 2 === 0;
        ctx.fillStyle = flash ? '#EF4444' : '#3B82F6';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 14;
        drawRoundedRect(-20, -10, 18, 10, 3);
        ctx.fill();
        ctx.fillStyle = flash ? '#3B82F6' : '#EF4444';
        ctx.shadowColor = ctx.fillStyle;
        drawRoundedRect(2, -10, 18, 10, 3);
        ctx.fill();
      } else if (state.car.topper === 'propeller') {
        // Spinning Carbon Helicopter Rotor
        ctx.translate(0, roofY - 18);
        ctx.fillStyle = '#64748B';
        ctx.fillRect(-4, 0, 8, 18);
        const bladeW = Math.cos(state.propellerAngle) * 68;
        ctx.fillStyle = '#F59E0B';
        drawRoundedRect(-Math.abs(bladeW), -4, Math.abs(bladeW) * 2, 8, 4);
        ctx.fill();
        ctx.fillStyle = '#EF4444';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();
      } else if (state.car.topper === 'crown') {
        // Golden 3D Champion Crown
        ctx.translate(0, roofY - 4);
        ctx.fillStyle = '#FACC15';
        ctx.strokeStyle = '#FEF08A';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-22, 4);
        ctx.lineTo(-18, -18);
        ctx.lineTo(-7, -7);
        ctx.lineTo(0, -22);
        ctx.lineTo(7, -7);
        ctx.lineTo(18, -18);
        ctx.lineTo(22, 4);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (state.car.topper === 'cone') {
        // Plasma Energy Cannon
        ctx.translate(0, roofY - 12);
        ctx.fillStyle = '#6366F1';
        ctx.strokeStyle = '#E0E7FF';
        ctx.lineWidth = 2;
        drawRoundedRect(-24, -10, 44, 18, 6);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#38BDF8';
        ctx.shadowColor = '#38BDF8';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(24, -1, 8, 0, Math.PI * 2);
        ctx.fill();
      } else if (state.car.topper === 'wing') {
        // Carbon GT Rear Spoiler Wing
        ctx.translate(-92, -62);
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(-8, 8);
        ctx.lineTo(-22, -26);
        ctx.lineTo(-12, -26);
        ctx.lineTo(2, 8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#EF4444';
        drawRoundedRect(-32, -32, 38, 8, 3);
        ctx.fill();
      }
      ctx.restore();

      // Acoustic Soundwave Rings when Honking
      if (state.hornWaveTimer > 0) {
        ctx.save();
        ctx.strokeStyle = '#38BDF8';
        ctx.lineWidth = 3.5;
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.arc(128, -32, 10 + i * 12 + (30 - state.hornWaveTimer) * 0.7, -0.65, 0.65);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Draw Front & Rear Detailed Wheels
      drawDetailedWheel(rearWheelX, wheelBaseY, 28, state.car.wheel, state.wheelAngle);
      drawDetailedWheel(frontWheelX, wheelBaseY, 28, state.car.wheel, state.wheelAngle);

      ctx.restore();
    }

    function drawParticlesAndBubbles() {
      // Sparks & Confetti
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      // Wash Bubbles
      for (let i = state.bubbles.length - 1; i >= 0; i--) {
        const b = state.bubbles[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        ctx.save();
        ctx.fillStyle = 'rgba(186, 230, 253, 0.65)';
        ctx.strokeStyle = '#7DD3FC';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        if (b.life <= 0) state.bubbles.splice(i, 1);
      }
    }

    function updatePhysics(w, h) {
      // Clouds
      state.clouds.forEach(c => {
        c.x -= c.speed * (state.mode === 'drive' ? 2.6 : 0.6);
        if (c.x < -80) c.x = w + 80;
      });

      // Lift smooth interpolation
      state.liftHeight += (state.liftTarget - state.liftHeight) * 0.12;

      // Robot arm animation decay
      if (state.robotArmProgress > 0) {
        state.robotArmProgress = Math.max(0, state.robotArmProgress - 0.035);
      }

      state.propellerAngle += state.boostTimer > 0 ? 0.55 : 0.28;
      if (state.hornWaveTimer > 0) state.hornWaveTimer--;
      if (state.boostTimer > 0) state.boostTimer--;
      if (state.washTimer > 0) state.washTimer--;

      // Wheel compression spring back
      state.frontWheelCompression *= 0.82;
      state.rearWheelCompression *= 0.82;

      if (state.mode === 'drive') {
        const boostFactor = state.boostTimer > 0 ? 2.2 : 1.0;
        const speed = 4.8 * state.speedMultiplier * boostFactor;
        state.roadOffset += speed;
        state.wheelAngle += speed * 0.048;

        const carX = w * 0.34;

        // Check Ramp Launch!
        state.ramps.forEach(ramp => {
          ramp.x -= speed;
          if (ramp.x < -200) {
            ramp.x = w + 350 + Math.random() * 400;
          }
          // If car is climbing the ramp
          if (!state.isJumping && carX > ramp.x - 20 && carX < ramp.x + ramp.width) {
            const ratio = Math.max(0, Math.min(1, (carX - ramp.x) / ramp.width));
            state.chassisY = -ratio * ramp.height;
            state.chassisPitch = -0.22;
            if (ratio > 0.85) {
              // Launch off the top of the ramp!
              state.isJumping = true;
              state.chassisVy = -11.5;
              state.chassisPitchV = 0.012;
              playSound('jump');
            }
          }
        });

        // Airborne & Suspension Physics
        if (state.isJumping) {
          state.chassisY += state.chassisVy;
          state.chassisVy += 0.55;
          state.chassisPitch += state.chassisPitchV;
          state.chassisPitch *= 0.96;

          if (state.chassisY >= 0) {
            state.chassisY = 0;
            state.chassisVy = -3.8; // Suspension rebound
            state.chassisPitch = 0;
            state.isJumping = false;
            state.frontWheelCompression = 10;
            state.rearWheelCompression = 10;
          }
        } else {
          state.chassisY += state.chassisVy;
          state.chassisVy += (0 - state.chassisY) * 0.25;
          state.chassisVy *= 0.76;
          state.chassisPitch *= 0.85;
        }

        // Collectibles Collision
        const carCenterY = h - 90 + state.chassisY;
        state.collectibles.forEach(item => {
          item.x -= speed;
          item.bobPhase += 0.09;

          if (Math.hypot(item.x - carX, item.y - carCenterY) < 76) {
            state.stars += 1;
            saveState();
            updateStarUI();
            playSound('star');
            if (item.type === 'nitro') {
              state.boostTimer = Math.max(state.boostTimer, 40);
            }
            for (let i = 0; i < 12; i++) {
              state.particles.push({
                x: item.x,
                y: item.y,
                vx: (Math.random() - 0.5) * 7,
                vy: (Math.random() - 0.5) * 7 - 2,
                size: 5 + Math.random() * 4,
                color: '#FACC15',
                life: 28
              });
            }
            item.x = w + 180 + Math.random() * 240;
            item.y = Math.random() > 0.45 ? h - 140 : h - 215;
            item.type = Math.random() > 0.3 ? 'star' : 'nitro';
          }

          if (item.x < -50) {
            item.x = w + 150 + Math.random() * 220;
          }
        });
      } else {
        // Garage suspension spring
        state.chassisY += state.chassisVy;
        state.chassisVy += (0 - state.chassisY) * 0.26;
        state.chassisVy *= 0.76;
        state.wheelAngle += 0.012;
      }
    }

    let animFrameId = null;
    function gameLoop() {
      const w = canvas.width;
      const h = canvas.height;

      updatePhysics(w, h);
      drawEnvironment(w, h);

      const carX = state.mode === 'drive' ? w * 0.34 : w * 0.5;
      drawCompleteCar(carX, h - 26);
      drawParticlesAndBubbles();

      animFrameId = requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      updateStarUI();
      renderCategoryOptions();
      spawnInitialCollectibles();
      if (animFrameId) cancelAnimationFrame(animFrameId);
      animFrameId = requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
